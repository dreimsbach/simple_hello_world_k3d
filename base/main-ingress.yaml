apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
 rules:
  - http:
      paths:
      - pathType: Prefix
        path: "/n8n"
        backend:
          service:
            name: n8n-nodeport
            port:
              number: 5678
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: hello-world-nodeport
            port:
              number: 80
