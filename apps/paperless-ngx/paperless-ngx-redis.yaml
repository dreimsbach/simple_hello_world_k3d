apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx-redis
spec:
  selector:
    matchLabels:
      app: paperless-ngx-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: paperless-ngx-redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-ngx-redis
spec:
  ports:
  - port: 6379
    protocol: TCP
    targetPort: 6379
  selector:
    app: paperless-ngx-redis
