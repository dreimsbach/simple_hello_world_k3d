  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/usr/share/k3dvolume/immich-db"
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-pvc
spec:
  storageClassName: manual
  volumeName: immich-db-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
