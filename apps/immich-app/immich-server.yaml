apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release
          env:
            - name: DB_HOSTNAME
              value: immich-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: IMMICH_DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: IMMICH_DB_PASSWORD
            - name: DB_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: immich-db-secret
                  key: IMMICH_DB_DATABASE
            - name: REDIS_HOSTNAME
              value: immich-redis
            - name: UPLOAD_LOCATION
              value: /usr/src/app/upload
          ports:
            - containerPort: 2283
          volumeMounts:
            - name: immich-library
              mountPath: /usr/src/app/upload
            - name: photoprism-library
              mountPath: /external/originals
              subPath: media/photos
              readOnly: true
      volumes:
        - name: immich-library
          persistentVolumeClaim:
            claimName: immich-library-pvc
        - name: photoprism-library
          persistentVolumeClaim:
            claimName: photoprism-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: 2283
