apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-deployment
spec:
  selector:
    matchLabels:
      app: n8n-web-server
  replicas: 1
  template:
    metadata:
      labels:
        app: n8n-web-server
    spec:
      volumes:
        - name: n8n-volume
          persistentVolumeClaim:
            claimName: n8n-pvc
      initContainers:
        - name: init-n8n-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - mountPath: "/data"
              name: n8n-volume
      containers:
        - name: n8n-web-server
          image: n8nio/n8n:latest
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "localhost"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "postgres"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_DATABASE
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: DB_POSTGRESDB_PASSWORD
            - name: N8N_PATH
              value: "/n8n/"
            - name: WEBHOOK_URL
              value: "http://localhost/n8n/"
            - name: N8N_EDITOR_BASE_URL
              value: "http://localhost/n8n/"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secret
                  key: N8N_ENCRYPTION_KEY
          volumeMounts:
            - mountPath: "/home/node/.n8n"
              name: n8n-volume
