apiVersion: apps/v1
kind: Deployment
metadata:
  name: photoprism-db
  labels:
    app: photoprism
spec:
  replicas: 1
  selector:
    matchLabels:
      pod-label: photoprism-db-pod
  template:
    metadata:
      labels:
        pod-label: photoprism-db-pod
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.7
        env:
        - name: MYSQL_DATABASE
          value: photoprism
        envFrom:
        - secretRef:
            name: photoprism-db-secret
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
          subPath: mariadb-data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: photoprism-pvc