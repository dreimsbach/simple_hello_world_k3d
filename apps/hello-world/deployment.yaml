apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: playground
  labels:
    app: hello-world
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          command:
            - /bin/sh
            - -c
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <html>
                <head><title>Hello World</title></head>
                <body>
                  <h1>Hello World</h1>
                  <p>Deployed as Deployment in namespace playground.</p>
                </body>
              </html>
              HTML
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: playground
spec:
  selector:
    app: hello-world
  ports:
    - name: http
      port: 80
      targetPort: 80
