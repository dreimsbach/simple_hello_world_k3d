apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_INSTANCE__
  namespace: __NAMESPACE__
  labels:
    app: __APP_INSTANCE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __APP_INSTANCE__
  template:
    metadata:
      labels:
        app: __APP_INSTANCE__
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          command:
            - /bin/sh
            - -c
            - |
              cat > /usr/share/nginx/html/index.html <<'HTML'
              <html>
                <head><title>__APP_NAME__ (__BRANCH_SLUG__)</title></head>
                <body>
                  <h1>__APP_NAME__</h1>
                  <p>Branch: __BRANCH_SLUG__</p>
                  <p>Namespace: __NAMESPACE__</p>
                </body>
              </html>
              HTML
              nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: __APP_INSTANCE__
  namespace: __NAMESPACE__
spec:
  selector:
    app: __APP_INSTANCE__
  ports:
    - name: http
      port: 80
      targetPort: 80
